name: R1 Abrechnung Automatik

# Kontrolle alle ~1-2 Stunden. Hintergrund: GitHub fuehrt Zeitplaene bei kleinen
# Repos unzuverlaessig aus und laesst besonders die "runden" Zeiten (:00) oft aus.
# Darum fragen wir alle 30 Min zu krummen Minuten an - ein Teil davon faellt aus,
# der Rest ergibt zuverlaessig einen Lauf alle 1-2 Stunden.
# Verbrauch: ~20s pro Lauf, also gut innerhalb des kostenlosen Kontingents.

on:
  schedule:
    - cron: "7,37 * * * *"       # alle 30 Min, bewusst nicht zur vollen Stunde
  workflow_dispatch: {}          # Manuell startbar unter Actions -> Run workflow
  repository_dispatch:           # Optionaler externer Ausloeser (z.B. cron-job.org)
    types: [abrechnung]

permissions:
  contents: write                # damit der Workflow auto_state.json committen darf

concurrency:
  group: abrechnung
  cancel-in-progress: false

jobs:
  abrechnung:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Abrechnungs-Status wiederherstellen
        run: |
          mkdir -p out
          cp state/auto_state.json out/auto_state.json 2>/dev/null || true

      - name: Auto-Abrechnung ausfuehren
        env:
          SUMUP_API_KEY: ${{ secrets.SUMUP_API_KEY }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python tutti_abrechnung.py --auto --out out

      - name: Abrechnungs-Status speichern (merkt sich abgerechnete Events)
        run: |
          git config user.name "abrechnung-bot"
          git config user.email "actions@github.com"
          mkdir -p state
          cp out/auto_state.json state/auto_state.json 2>/dev/null || true
          if [ -f state/auto_state.json ]; then
            git add state/auto_state.json
            git diff --cached --quiet || git commit -m "State: abgerechnete Events aktualisiert"
            git push
          fi

      # Haelt das Repo "aktiv": GitHub deaktiviert Zeitplaene nach 60 Tagen ohne
      # Aktivitaet. Ein woechentlicher Mini-Commit verhindert das zuverlaessig.
      - name: Repo aktiv halten (Heartbeat, montags)
        if: always()
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            mkdir -p state
            date -u +"letzter Heartbeat: %Y-%m-%d" > state/heartbeat.txt
            git add state/heartbeat.txt
            git diff --cached --quiet || (git commit -m "Heartbeat" && git push)
          fi

      - name: Abrechnungsdateien als Artefakt sichern (Backup, 90 Tage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abrechnungen-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
          retention-days: 90
