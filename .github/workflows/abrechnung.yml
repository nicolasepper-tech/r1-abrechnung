name: R1 Abrechnung Automatik

# Selbst-ausloesende Kette fuer OEFFENTLICHE Repos (dort sind Actions-Minuten
# unbegrenzt). Jeder Lauf plant am Ende den naechsten in ~15 Min ein, unabhaengig
# von GitHubs unzuverlaessigem Zeitplan. Der Zeitplan bleibt nur als Zuendung/Notnetz.
# ACHTUNG: NICHT fuer private Repos - dort wuerde die Wartezeit das Minutenkontingent
# sprengen.

on:
  schedule:
    - cron: "7,37 * * * *"       # Zuend-/Notfallplan, falls die Kette mal abreisst
  workflow_dispatch: {}          # Manuell startbar
  repository_dispatch:           # Selbst-Ausloeser (Workflow triggert sich hierueber)
    types: [abrechnung]

permissions:
  contents: write
  actions: write

concurrency:
  group: abrechnung
  cancel-in-progress: false

jobs:
  abrechnung:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Abrechnungs-Status wiederherstellen
        run: |
          mkdir -p out
          cp state/auto_state.json out/auto_state.json 2>/dev/null || true

      - name: Auto-Abrechnung ausfuehren
        env:
          SUMUP_API_KEY: ${{ secrets.SUMUP_API_KEY }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python tutti_abrechnung.py --auto --out out

      - name: Abrechnungs-Status speichern
        run: |
          git config user.name "abrechnung-bot"
          git config user.email "actions@github.com"
          mkdir -p state
          cp out/auto_state.json state/auto_state.json 2>/dev/null || true
          if [ -f state/auto_state.json ]; then
            git add state/auto_state.json
            git diff --cached --quiet || git commit -m "State: abgerechnete Events aktualisiert"
            git push
          fi

      - name: Abrechnungsdateien als Artefakt sichern (Backup, 90 Tage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abrechnungen-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
          retention-days: 90

      # Kette am Leben halten: nach 15 Min naechsten Lauf ausloesen.
      # if: always() -> laeuft auch, wenn oben etwas schiefging, damit die Kette haelt.
      - name: Naechsten Lauf in 15 Min einplanen
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 900
          gh api repos/${{ github.repository }}/dispatches -f event_type=abrechnung
