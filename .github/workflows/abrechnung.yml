name: R1 Abrechnung Automatik

# Selbst-ausloesender Zeitplan: Jeder Lauf stoesst am Ende den naechsten in ~15 Min an.
# WICHTIG: Nur fuer OEFFENTLICHE Repos gedacht (dort sind Actions-Minuten unbegrenzt).
# Bei privatem Repo wuerde die 15-Min-Schleife das kostenlose Minutenkontingent sprengen
# -> dann stattdessen den externen Ping (cron-job.org) nutzen.

on:
  schedule:
    - cron: "20 * * * *"        # Zuend-/Notfallplan (startet die Kette neu, falls sie abreisst)
  workflow_dispatch: {}          # Manuell startbar unter Actions -> Run workflow
  repository_dispatch:           # Selbst-Ausloeser (der Workflow triggert sich hierueber neu)
    types: [abrechnung]

permissions:
  contents: write                # State committen
  actions: write                 # sich selbst neu anstossen duerfen

concurrency:
  group: abrechnung
  cancel-in-progress: false

jobs:
  abrechnung:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Abrechnungs-Status wiederherstellen
        run: |
          mkdir -p out
          cp state/auto_state.json out/auto_state.json 2>/dev/null || true

      - name: Auto-Abrechnung ausfuehren
        env:
          SUMUP_API_KEY: ${{ secrets.SUMUP_API_KEY }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python tutti_abrechnung.py --auto --out out

      - name: Abrechnungs-Status speichern
        run: |
          git config user.name "abrechnung-bot"
          git config user.email "actions@github.com"
          mkdir -p state
          cp out/auto_state.json state/auto_state.json 2>/dev/null || true
          if [ -f state/auto_state.json ]; then
            git add state/auto_state.json
            git diff --cached --quiet || git commit -m "State: abgerechnete Events aktualisiert"
            git push
          fi

      - name: Abrechnungsdateien als Artefakt sichern (Backup, 90 Tage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abrechnungen-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
          retention-days: 90

      # Kette am Leben halten: nach ~15 Min den naechsten Lauf selbst ausloesen.
      # Laeuft auch, wenn oben etwas schiefging (if: always), damit die Kette nicht abreisst.
      - name: Naechsten Lauf in ~15 Min einplanen
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 900
          gh api repos/${{ github.repository }}/dispatches -f event_type=abrechnung
